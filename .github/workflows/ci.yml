name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate dataset (schema + integrity)
        run: hypnos validate

      - name: Run test suite
        run: pytest -q

  notebooks:
    name: reference notebooks (nbmake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,notebooks]"
      - name: Execute notebooks in CI
        run: pytest --nbmake notebooks/ -q

  exports:
    name: regenerate exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Generate export artifacts
        run: |
          for fmt in nonmem pharmml sbml tci_json rxode2 pumas bibtex csv; do
            hypnos export --format "$fmt" --output "exports/$fmt"
          done
      - name: Build and validate COMBINE .omex archive
        run: |
          hypnos export --format omex --output exports/hypnos.omex
          python -c "import zipfile, xml.dom.minidom as m; z=zipfile.ZipFile('exports/hypnos.omex'); m.parseString(z.read('manifest.xml')); assert 'manifest.xml' in z.namelist(); print('omex OK:', len(z.namelist()), 'entries')"
      - name: Verify exports regenerate deterministically
        run: |
          python scripts/regenerate.py --exports
          A=$(python -c "from hypnos.export import combine; import hypnos; print(len(combine.build_dataset_archive(hypnos.load())))")
          B=$(python -c "from hypnos.export import combine; import hypnos; print(len(combine.build_dataset_archive(hypnos.load())))")
          test "$A" = "$B" && echo "deterministic ($A bytes)"
      - name: Upload exports
        uses: actions/upload-artifact@v4
        with:
          name: hypnos-exports
          path: exports/

  build:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (with synced dataset)
        run: |
          python -m pip install --upgrade pip build
          python sync_dataset_into_package.py
          python -m build
      - name: Verify wheel imports and loads dataset
        run: |
          pip install dist/*.whl
          cd /tmp && python -c "import hypnos; ds = hypnos.load(); assert len(ds) >= 4; print('wheel OK', ds)"
