[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypnos-pkpd"
version = "0.1.0"
description = "Curated, citation-backed, tier-annotated dataset of anesthetic PK/PD models with envelope-aware forward simulation and pharmacometric exports."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Clay Good" }]
keywords = [
  "pharmacokinetics", "pharmacodynamics", "anesthesia", "propofol",
  "TCI", "pharmacometrics", "PK/PD", "NONMEM", "PharmML", "SBML",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.21",
  "scipy>=1.7",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.20", "pandas>=1.3", "altair>=4.2"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
notebooks = ["nbmake>=1.4", "ipykernel>=6.0", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/clay-good/hypnos"
Repository = "https://github.com/clay-good/hypnos"
Specification = "https://github.com/clay-good/hypnos/blob/main/docs/specs/v0.1/spec.md"

[project.scripts]
hypnos = "hypnos.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
include = ["hypnos*"]

[tool.setuptools.package-data]
hypnos = ["dataset/**/*"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
